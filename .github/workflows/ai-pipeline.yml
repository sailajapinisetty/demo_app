name: AI Self-Healing Test Pipeline

on:
  pull_request:
    branches: [ main ]

# CRITICAL: Gives GitHub Actions permission to write comments back to your PR
permissions:
  pull-requests: write
  contents: read

jobs:
  ai-test-and-heal:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Start your React App in the background
      - name: Install & Start React Demo App
        run: |
          npm install
          npm run dev & 
          # This forces the runner to pause until port 5173 is actively serving traffic
          npx wait-on http://localhost:5173 --timeout 30000 

      # 4. Install dependencies for your AI platform folder
      - name: Install Platform Dependencies
        run: |
          cd ai-testing-platform
          npm install
          npx playwright install --with-deps

      # 5. Run the Smart Test Script using Claude
      - name: Run Self-Healing Automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd ai-testing-platform
          #  FIXED: Execute runner, save the process ID, and force kill background servers when finished
          node healer-runner.js
          echo "Test run step complete. Clean killing active background services..."
          pkill -f "node" || true

      # 6. Post the Claude Report directly into the GitHub PR Comments
      - name: Post Report to PR
        uses: mshick/add-pr-comment@v2
        if: always() 
        with:
          #  FIXED: Changed from 'file-path' to 'message-path'
          message-path: ./ai-testing-platform/pipeline-output.txt
