name: AI Self-Healing Test Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-test-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Safety net to prevent unexpected runaway bills

    steps:
      # 1. Check out the codebase
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Set up clean Node environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Clean install application and platform requirements
      - name: Install All Dependencies
        run: |
          npm install
          cd ai-testing-platform
          npm install
          npx playwright install --with-deps

      # 4.  THE NATIVE FIX: Boot the React Server quietly using nohup
      # This strips all process handles, forcing the Linux shell to proceed immediately.
      - name: Start React App in Background
        run: |
          nohup npm run dev > react-server.log 2>&1 &
          echo "Waiting for http://localhost:5173 to wake up..."
          npx wait-on http://localhost:5173 --timeout 30000

      # 5. Execute Claude test generation, browser execution, and self-healing logic
      - name: Run Self-Healing Automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd ai-testing-platform
          node healer-runner.js

      # 6. Post the generated pipeline markdown report directly to the PR comments
      - name: Post Report to PR
        uses: mshick/add-pr-comment@v2
        if: always() # Ensures the metrics drop even if tests hit structural breaks
        with:
          message-path: ./ai-testing-platform/pipeline-output.txt
      
        # 7. Upload the physical files to the GitHub Actions dashboard
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-generated-test-suite
          path: |
            ./ai-testing-platform/generated.spec.js
            ./ai-testing-platform/pipeline-output.txt
