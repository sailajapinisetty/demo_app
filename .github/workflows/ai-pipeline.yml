name: AI Self-Healing Test Pipeline

on:
  pull_request:
    branches: [ main ]

# Explicitly time-box the entire job to 5 minutes max to guarantee it never hangs again
defaults:
  run:
    shell: bash

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-test-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 🔴 SAFETY NET: Automatically kills the run if it exceeds 5 mins

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Handle Platform Install Ahead of Time
      - name: Install Platform Dependencies
        run: |
          npm install
          cd ai-testing-platform
          npm install
          npx playwright install --with-deps

      # 4. 🚀 THE CRITICAL FIX: Run the React Server cleanly in an isolated, auto-terminating background thread
      - name: Start React App in Background
        uses: houzyk/background-action@v1
        with:
          run: npm run dev
          wait-on: http://localhost:5173
          timeout: 30

      # 5. Run the Smart Test Script using Claude (Will execute instantly and exit)
      - name: Run Self-Healing Automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd ai-testing-platform
          node healer-runner.js

      # 6. Post the Claude Report directly into the GitHub PR Comments
      - name: Post Report to PR
        uses: mshick/add-pr-comment@v2
        if: always() 
        with:
          message-path: ./ai-testing-platform/pipeline-output.txt
